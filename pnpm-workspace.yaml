# electron-builder 打包时使用 npm 风格的扁平 node_modules，避免符号链接结构问题
nodeLinker: hoisted

# 依赖构建脚本审批（pnpm strictDepBuilds 默认拦截 postinstall）
allowBuilds:
  electron: true
  electron-winstaller: true

# 强制 extract-zip（被 electron install.js 等依赖）使用已修复 Node 24.16+/26
# 经典流 backpressure 停摆问题的 yauzl（nodejs/node#63487，extract-zip 本体已停更）
overrides:
  yauzl: ^3.3.1
